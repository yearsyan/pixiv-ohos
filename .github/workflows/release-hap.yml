name: Build unsigned release HAP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish; leave empty for an artifact-only build'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgl1

      - name: Set up HarmonyOS tools
        uses: ErBWs/setup-ohos@4dbb63025116eb6165ceac58a4bf47cbdc5ac721 # v2
        with:
          version: '26.0.0.821'
          cache: true

      - name: Prepare unsigned build
        run: |
          cp build-profile.example.json5 build-profile.json5
          echo "DEVECO_SDK_HOME=$HOS_SDK_HOME" >> "$GITHUB_ENV"

      - name: Install OHPM dependencies
        run: ohpm install --all

      - name: Build release HAP
        run: |
          hvigorw --mode module \
            -p product=default \
            -p module=entry@default \
            -p buildMode=release \
            assembleHap --no-daemon

      - name: Generate HAP checksum
        working-directory: entry/build/default/outputs/default
        run: sha256sum entry-default-unsigned.hap > entry-default-unsigned.hap.sha256

      - name: Upload unsigned HAP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pixiv-ohos-unsigned-${{ github.run_number }}
          path: |
            entry/build/default/outputs/default/entry-default-unsigned.hap
            entry/build/default/outputs/default/entry-default-unsigned.hap.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    needs: build
    if: github.ref_type == 'tag' || inputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Download unsigned HAP
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pixiv-ohos-unsigned-${{ github.run_number }}
          path: release

      - name: Publish GitHub Release
        shell: bash
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          sha256sum --check entry-default-unsigned.hap.sha256
          assets=(entry-default-unsigned.hap entry-default-unsigned.hap.sha256)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          HarmonyOS release 构建，附件为未签名 HAP，需要自行签名后安装到真机。

          下载 `.hap` 和 `.hap.sha256` 后，可在同一目录执行 `shasum -a 256 -c entry-default-unsigned.hap.sha256` 校验文件完整性。
          EOF
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
          fi
